<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mobile Gomoku AI</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <section id="startScreen" class="screen start-screen">
      <div class="hero">
        <p class="eyebrow">Mobile Gomoku AI</p>
        <h1>오목 AI</h1>
        <p class="hero-copy">모바일에서 바로 AI와 대국합니다.</p>
      </div>

      <div class="start-card">
        <label>
          AI 모델
          <select id="aiModel">
            <option value="greedy">Greedy</option>
            <option value="search" selected>Alpha-Beta</option>
            <option value="tactical">Tactical</option>
          </select>
        </label>
        <label>
          AI 난이도
          <select id="difficulty">
            <option value="1">빠름</option>
            <option value="2" selected>보통</option>
            <option value="3">깊게 생각</option>
          </select>
        </label>
        <label>
          선공
          <select id="firstPlayer">
            <option value="human" selected>나</option>
            <option value="ai">AI</option>
          </select>
        </label>
        <button id="startBtn" class="primary">대국 시작</button>
      </div>
    </section>

    <section id="gameScreen" class="screen game-screen" hidden>
      <section class="top">
        <div>
          <h1>오목 AI</h1>
          <p id="status">흑돌을 두세요. 당신이 먼저 시작합니다.</p>
        </div>
        <button id="resetBtn" class="reset">새 게임</button>
      </section>

      <section class="panel">
        <div id="boardWrap" class="board-wrap">
          <canvas id="board" width="720" height="720" aria-label="오목판"></canvas>
        </div>

        <div class="legend">
          <span><i class="stone black"></i> 나</span>
          <span><i class="stone white"></i> AI</span>
        </div>
      </section>
    </section>
  </main>

  <section id="resultModal" class="modal" aria-hidden="true" hidden>
    <div class="modal-card">
      <p id="resultLabel" class="result-label">Game Over</p>
      <h2 id="resultTitle">승리했습니다.</h2>
      <p id="resultMessage">좋은 대국이었습니다.</p>
      <div class="result-actions">
        <button id="restartBtn" class="primary">다시 두기</button>
        <button id="homeBtn" class="secondary">처음으로</button>
      </div>
    </div>
  </section>

  <script src="./ai.js"></script>
  <script src="./app.js"></script>
</body>
</html>
